name: Deploy website to AWS EC2

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add EC2 to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            export PATH=$PATH:/usr/local/bin:/usr/bin

            sudo dnf update -y

            if ! command -v git &> /dev/null; then
              sudo dnf install -y git
            fi

            if ! command -v node &> /dev/null; then
              curl -fsSL https://rpm.nodesource.com/setup_18.x | sudo bash -
              sudo dnf install -y nodejs
            fi

            if ! command -v pm2 &> /dev/null; then
              sudo npm install -g pm2
            fi

            if ! command -v nginx &> /dev/null; then
              sudo dnf install -y nginx
              sudo systemctl enable nginx
              sudo systemctl start nginx
            fi

            if ! command -v certbot &> /dev/null; then
              sudo dnf install -y certbot python3-certbot-nginx
            fi

            mkdir -p /home/ec2-user/theo-website
            cd /home/ec2-user/theo-website

            if [ ! -d ".git" ]; then
              git clone https://github.com/cheftheo/theo-website.git .
            fi

            git config --global --add safe.directory /home/ec2-user/theo-website
            git fetch origin dev
            git checkout dev
            git pull origin dev

            npm install
            npm run build

            sudo pm2 restart theo-app || sudo pm2 start npm --name "theo-app" -- start -- -p 80
            sudo pm2 save

            sudo tee /etc/nginx/conf.d/theo.conf > /dev/null <<EOL
            server {
                listen 80;
                server_name theo-network.online www.theo-network.online;
                return 301 https://$host$request_uri;
              }

              server {
                listen 443 ssl;
                server_name theo-network.online www.theo-network.online;

                ssl_certificate /etc/letsencrypt/live/theo-network.online/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/theo-network.online/privkey.pem;

                location / {
                  proxy_pass http://127.0.0.1:80;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_cache_bypass $http_upgrade;
                }
              }
            }
            EOL

            sudo nginx -t
            sudo systemctl restart nginx

            sudo certbot --nginx --non-interactive --agree-tos --redirect -m marascu.theodor@example.com -d theo-network.online -d www.theo-network.online

            echo "0 3 * * * root certbot renew --quiet" | sudo tee -a /etc/crontab
          EOF
