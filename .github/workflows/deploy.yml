name: Deploy website to AWS EC2

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add EC2 to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            export PATH=$PATH:/usr/local/bin:/usr/bin

            # Update packages
            sudo yum update -y

            # Install Git if missing
            if ! command -v git &> /dev/null; then
              sudo yum install -y git
            fi

            # Install Node.js
            if ! command -v node &> /dev/null; then
              curl -fsSL https://rpm.nodesource.com/setup_18.x | sudo bash -
              sudo yum install -y nodejs
            fi

            # Install PM2
            if ! command -v pm2 &> /dev/null; then
              sudo npm install -g pm2
            fi

            # Create app directory
            mkdir -p /home/ec2-user/theo-website
            cd /home/ec2-user/theo-website

            # Clone repo if needed
            if [ ! -d ".git" ]; then
              git clone https://github.com/cheftheo/theo-website.git .
            fi

            git config --global --add safe.directory /home/ec2-user/theo-website
            git fetch origin dev
            git checkout dev
            git pull origin dev

            npm install
            npm run build

            pm2 restart theo-app || pm2 start npm --name "theo-app" -- start
            pm2 save
          EOF
