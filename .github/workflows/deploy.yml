name: Deploy website to AWS EC2

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add EC2 to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            export PATH=$PATH:/usr/local/bin:/usr/bin

            # Install required packages
            sudo dnf update -y
            sudo dnf install -y git nginx certbot python3-certbot-nginx

            # Install Node.js
            if ! command -v node &> /dev/null; then
              curl -fsSL https://rpm.nodesource.com/setup_18.x | sudo bash -
              sudo dnf install -y nodejs
            fi

            # Install PM2
            sudo npm install -g pm2

            # Clone or update repo
            APP_DIR="/home/ec2-user/theo-website"
            if [ ! -d "$APP_DIR" ]; then
              git clone https://github.com/cheftheo/theo-website.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin dev
            git checkout dev
            git pull origin dev

            # Install dependencies and build
            npm install
            npm run build

            # Restart or start app with PM2 on port 3000
            sudo pm2 start npm --name "theo-app" -- start -- -p 3000 || sudo pm2 restart theo-app
            sudo pm2 save

            # Configure Nginx
            sudo tee /etc/nginx/conf.d/theo.conf > /dev/null <<EOL
            server {
              listen 80;
              server_name theo-network.online www.theo-network.online;

              location / {
                proxy_pass http://127.0.0.1:3000;
                proxy_http_version 1.1;
                proxy_set_header Upgrade \$http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host \$host;
                proxy_cache_bypass \$http_upgrade;
              }
            }

            sudo nginx -t
            sudo systemctl reload nginx

            # Obtain or renew SSL certificate
            sudo certbot --nginx --non-interactive --agree-tos --redirect -m marascu.theodor@example.com -d theo-network.online -d www.theo-network.online

            # Add automatic renewal cron job
            if ! grep -q "certbot renew" /etc/crontab; then
              echo "0 3 * * * root certbot renew --quiet && systemctl reload nginx" | sudo tee -a /etc/crontab
            fi
          EOF
