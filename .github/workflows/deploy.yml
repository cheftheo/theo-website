name: deploy webste to AWS EC2

on:
  push:
    branches:
      - dev 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Set environment variables and install global packages
        run: |
          echo "NODE_ENV=production" >> $GITHUB_ENV
          npm install -g pm2
          npm install -g git 

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Fetch Dev branch
        run: git fetch origin dev

      - name: set the SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: add known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: deploy
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin

            # Mark directory as safe for git (fixes "dubious ownership" error)
            git config --global --add safe.directory /home/ec2-user/theo-website

            # Go to app directory
            cd /home/ec2-user/theo-website

            # Fix ownership and permissions just in case
            sudo chown -R ec2-user:ec2-user /home/ec2-user/theo-website
            chmod -R u+rwX /home/ec2-user/theo-website

            # Pull, install, build and restart with PM2
            git pull origin dev
            npm install
            npm run build
            pm2 restart theo-app || pm2 start npm --name "theo-app" -- start
            pm2 save
          EOF
