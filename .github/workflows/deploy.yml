name: Deploy with Docker

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: self-hosted  

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t theo-app .

      - name: Stop and Remove Old Container
        run: |
          docker stop theo-app || true
          docker rm theo-app || true

      - name: Run New Container
        run: |
          docker run -d \
            --name theo-app \
            --restart always \
            -p 3000:3000 \
            theo-app

      - name: Prune Old Images
        run: |
          docker image prune -f